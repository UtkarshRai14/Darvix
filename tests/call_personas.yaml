# Simulated test customers. Each persona is played by an LLM, spoken with a native neural voice, and sent
# through the full pipeline (real Whisper ASR -> agent -> TTS). Run: python -m app.agent.simulate
#
# check types: outcome_in, action, answer_status_seen, cited_category_any, conflict_detected, verified

- id: in_cooperative
  profile: health_lead_in
  coverage: [cooperative customer]
  voice: en-IN-PrabhatNeural
  persona: >
    You are Rohan Verma, 34, living in Pune. You want health cover for yourself, your wife Neha (31) and your
    son (4). Nobody has any pre-existing disease. You would like 10 lakh cover and your budget is around
    20,000 rupees a year. You already have 3 lakh employer cover. At some point ask whether maternity is covered,
    because you may plan a second child. When asked, agree to be contacted by an advisor tomorrow at 6 pm.
  language: Speak natural Indian English.
  checks:
    - {type: outcome_in, values: [qualified]}
    - {type: action, value: lead_created}
    - {type: answer_status_seen, value: answered_from_kb}

- id: in_objection_out_of_scope
  profile: health_lead_in
  coverage: [objection, out-of-scope question]
  voice: en-IN-PrabhatNeural
  persona: >
    You are Suresh Rao, 41, from Hyderabad. You want cover for yourself and your wife (age 45); she has
    hypertension. You are sceptical: first say health insurance is too expensive, then say you already have
    insurance from your office. Also ask "what is your claim settlement ratio?" and later "does it cover
    treatment abroad?". If the agent handles you well, accept 10 lakh cover with a budget of 25,000 rupees a year
    and agree to an advisor callback on Saturday at 11 am.
  language: Speak natural Indian English.
  checks:
    - {type: cited_category_any, values: [objection]}
    - {type: answer_status_seen, value: info_unavailable}
    - {type: outcome_in, values: [qualified_underwriting, incomplete]}

- id: in_conflict_human_request
  profile: health_lead_in
  coverage: [incomplete or conflicting details, human-assistance request]
  voice: en-IN-PrabhatNeural
  persona: >
    You are Vikram, from Delhi, looking for cover for yourself and your father (68). First say you are 42 years
    old; a couple of turns later say "sorry, actually I am 38". When asked about health conditions say you think
    your father might have diabetes but you are not sure. Give short, slightly vague answers. After about five
    exchanges, get impatient and insist on talking to a real person.
  language: Speak natural Indian English.
  checks:
    - {type: conflict_detected}
    - {type: action, value: escalated_to_human}

- id: ph_cooperative_taglish
  profile: life_premium_ph
  coverage: [cooperative customer, mixed English/finance terms, Taglish code-switching]
  voice: fil-PH-AngeloNeural
  persona: >
    You are Mark Dela Cruz, the policyholder. Confirm who you are. When asked for the last 4 digits of the policy
    number, say "four eight two one". You missed the premium because your auto-debit failed - kulang yung balance
    mo nung due date. Ask if you are still covered even if late, and ask about adding a rider because you want more
    coverage for your wife; agree to a bank referral if offered. Commit to paying this Friday through the Sinag
    Bank app.
  language: >
    Speak natural Manila Taglish like an office worker: Tagalog sentence structure mixed with English words
    (premium, policy, due date, coverage, rider, auto-debit, grace period). Use "po" sometimes.
  checks:
    - {type: verified}
    - {type: outcome_in, values: [promise_to_pay]}
    - {type: answer_status_seen, value: answered_from_kb}

- id: ph_objection_escalation
  profile: life_premium_ph
  coverage: [sector-specific objection, colloquial speech, human escalation]
  voice: fil-PH-AngeloNeural
  persona: >
    You are Mark Dela Cruz, the policyholder. Verify with "four eight two one". You lost your job last month.
    Say you have no money right now and that you are thinking of cancelling the policy. Ask what happens if the
    policy lapses. After the agent answers, ask to talk to a real person or an advisor.
  language: >
    Speak casual, mostly Filipino (Tagalog) with natural fillers like "eh", "kasi", "naman", "e di", and only
    a few English words.
  checks:
    - {type: verified}
    - {type: action, value: escalated_to_human}
    - {type: cited_category_any, values: [objection, policy]}

- id: id_cooperative_formal
  profile: multifinance_id
  coverage: [cooperative customer, mixed English/finance terms, formal register]
  voice: id-ID-ArdiNeural
  persona: >
    You are Budi Santoso, the customer. Confirm your identity. When asked for the last 4 digits of the contract
    number, say "tujuh tujuh tiga satu". Ask how much the late penalty (denda) is so far, whether you can pay by
    virtual account, and how many months of tenor are left. Promise to pay on Saturday through virtual account.
  language: >
    Speak polite, formal Bahasa Indonesia, using common finance loanwords such as DP, tenor, virtual account.
  checks:
    - {type: verified}
    - {type: outcome_in, values: [promise_to_pay]}
    - {type: answer_status_seen, value: answered_from_kb}

- id: id_javanese_colloquial
  profile: multifinance_id
  coverage: [regional accent (Javanese), colloquial speech, sector-specific objection, human escalation]
  voice: jv-ID-DimasNeural
  persona: >
    You are Budi Santoso from Solo, Central Java. Confirm it is you ("nggih, leres") and verify with
    "tujuh tujuh tiga satu". Complain that you have not been paid yet (belum gajian) and that the penalty is too
    expensive. Then explain your motorbike is broken so you cannot work as an ojek driver, and ask for relief or
    restructuring (keringanan). If the agent offers a branch officer, accept.
  language: >
    Speak colloquial Indonesian as used in Central Java, with Javanese particles and words such as nggih,
    mboten, sampun, lho, je, monggo, and casual forms like nggak, udah, gimana.
  checks:
    - {type: verified}
    - {type: action, value: escalated_to_human}
    - {type: cited_category_any, values: [objection, policy]}
